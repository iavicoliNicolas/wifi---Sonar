<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WiFi Sonar</title>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">Hogar propio · procesamiento local</p>
        <h1>WiFi Sonar</h1>
      </div>
      <p id="connection" class="pill">desconectado</p>
    </header>
    <main>
      <p id="state" data-state="vacío">—</p>
      <p id="detail">esperando la señal</p>
      <section class="charts">
        <figure>
          <figcaption>Amplitud por subportadora</figcaption>
          <canvas id="heatmap" width="640" height="160"></canvas>
        </figure>
        <figure>
          <figcaption>Score y umbrales</figcaption>
          <canvas id="score" width="640" height="160"></canvas>
        </figure>
      </section>
      <section>
        <h2>Eventos</h2>
        <ol id="timeline"></ol>
      </section>
    </main>
    <script src="/assets/app.js"></script>
  </body>
</html>
