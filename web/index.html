<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wifi sonar</title>
    <link rel="icon" href="/favicon.ico" type="image/png" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="top">
      <p class="mark">wifi sonar</p>
      <p id="link" class="link" data-state="off">conectando</p>
    </header>
    <p id="sensing" data-state="on">sensado activo</p>
    <main>
      <p class="kicker">esta habitación</p>
      <ul id="zones"></ul>
      <p id="mode-note" hidden>modo RSSI · sensibilidad baja. No distingue a alguien quieto. Cada nombre es una fila.</p>
      <h1 id="state" data-state="empty">vacío</h1>
      <p id="score" class="score">score 0.00</p>
      <section class="charts">
        <figure>
          <figcaption>amplitud por subportadora</figcaption>
          <canvas id="heatmap" width="720" height="120"></canvas>
        </figure>
        <figure>
          <figcaption>score y umbral</figcaption>
          <canvas id="scoreboard" width="720" height="120"></canvas>
        </figure>
        <figure>
          <figcaption>línea de tiempo</figcaption>
          <ol id="timeline"></ol>
        </figure>
      </section>
      <section class="settings" id="settings">
        <h2>ajustes</h2>
        <label>fuente
          <select id="mode">
            <option value="csi">CSI</option>
            <option value="rssi">RSSI</option>
          </select>
        </label>
        <label>dispositivos propios <input id="devices" type="text" placeholder="ap-living, tele" /></label>
        <label>sensibilidad (k) <input id="sensibility" type="range" min="2" max="12" step="0.5" /> <output id="sensibility-out"></output></label>
        <label>ventana (s) <input id="window" type="range" min="0.2" max="3" step="0.1" /> <output id="window-out"></output></label>
        <label>histéresis <input id="hysteresis" type="range" min="0" max="0.9" step="0.05" /> <output id="hysteresis-out"></output></label>
        <label class="check"><input id="notify" type="checkbox" /> notificación del navegador</label>
        <label>webhook local <input id="webhook" type="url" placeholder="http://127.0.0.1:9/hook" /></label>
        <p id="config-note"></p>
        <p id="retention"></p>
        <div class="controls">
          <button id="pause" type="button">pausar</button>
          <button id="record" type="button">grabar traza</button>
          <button id="wipe" type="button">borrar historial</button>
        </div>
        <p id="record-note"></p>
      </section>
      <section class="wizard" id="wizard">
        <h2>calibración</h2>
        <p id="cal-prompt">Dejá la habitación vacía y pulsá calibrar.</p>
        <p id="cal-count" hidden></p>
        <button id="cal-start" type="button">calibrar</button>
        <p id="cal-result"></p>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
