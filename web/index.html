<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WiFi Sonar</title>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">Hogar propio · procesamiento local</p>
        <h1>WiFi Sonar</h1>
      </div>
      <div class="header-actions">
        <button id="calibrate" type="button">Calibrar</button>
        <p id="connection" class="pill">desconectado</p>
      </div>
    </header>
    <p id="sensing" class="banner" data-paused="0">Sensado activo</p>
    <main>
      <p id="state" data-state="vacío">—</p>
      <p id="detail">esperando la señal</p>
      <section class="charts">
        <figure>
          <figcaption>Amplitud por subportadora</figcaption>
          <canvas id="heatmap" width="640" height="160"></canvas>
        </figure>
        <figure>
          <figcaption>Score y umbrales</figcaption>
          <canvas id="score" width="640" height="160"></canvas>
        </figure>
      </section>
      <section>
        <h2>Zonas</h2>
        <ul id="zones"></ul>
      </section>
      <section>
        <h2>Eventos</h2>
        <ol id="timeline"></ol>
      </section>
      <section id="privacy">
        <h2>Privacidad</h2>
        <p id="retention"></p>
        <div class="header-actions">
          <button id="pause" type="button">Pausar</button>
          <button id="erase" type="button">Borrar historial</button>
        </div>
      </section>
      <section id="settings">
        <h2>Configuración</h2>
        <label>Sensibilidad <input id="sensitivity" type="range" min="0.2" max="3" step="0.1" /></label>
        <label>Ventana (s) <input id="window" type="range" min="0.5" max="5" step="0.1" /></label>
        <label>Histéresis <input id="hysteresis" type="range" min="0" max="0.7" step="0.05" /></label>
        <label>Webhook local <input id="webhook" type="url" placeholder="http://127.0.0.1:9/aviso" /></label>
        <label class="check"><input id="alerts" type="checkbox" /> Avisar en el navegador</label>
        <p id="settings-note"></p>
      </section>
    </main>
    <dialog id="wizard">
      <h2>Calibración</h2>
      <p>Salí de la habitación. La captura tiene que ser con el ambiente vacío.</p>
      <p id="countdown"></p>
      <p id="wizard-result"></p>
      <div class="dialog-actions">
        <button id="wizard-start" type="button">Empezar</button>
        <button id="wizard-close" type="button">Cerrar</button>
      </div>
    </dialog>
    <script src="/assets/app.js"></script>
  </body>
</html>
